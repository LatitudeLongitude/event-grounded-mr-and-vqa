[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-event-pipeline"
version = "0.1.0"
description = "CPU-first CASTLE MM26 L0-L5 event segmentation pipeline."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pyarrow>=15",
  "PyYAML>=6",
]

[project.scripts]
event-pipeline = "event_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["event_pipeline*"]
