[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-chunking"
version = "1.0.0"
description = "Stage 2 transcript chunking for embedding-ready CASTLE transcript data."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
embed-chunking = "embed_chunking.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["embed_chunking*"]
