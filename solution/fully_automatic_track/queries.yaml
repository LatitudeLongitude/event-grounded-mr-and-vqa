schema_version: castle_mm26_query_registry_v1
challenge: CASTLE MM26
official_source:
  challenge_url: https://castle-dataset.github.io/challenges/mm26/
  verified_at_utc: "<filled-by-preflight>"
  page_snapshot_sha256: "<filled-by-preflight>"
  extracted_queries_sha256: "<filled-by-preflight>"
registered_unicode_normalizations: [unicode_nfc, curly_quote_to_ascii_for_retrieval, bjorn_source_ascii, bjorn_answer_display, whitespace_collapse]
task_counts:
  event_instance_search: 12
  object_instance_search: 12
  question_answering: 12
global_defaults:
  language: en
  time_unit: seconds_since_day_start
  output_time_format: HH:MM:SS
  bjorn_source_name: Bjorn
  bjorn_answer_name: "Björn"
type_defaults:
  event_instance_search:
    expected_granularity: {primary_levels: [L2, L1], context_levels: [L3, L4], output_level: source_specific_interval}
    evidence_policy: {primary_modalities: [visual], secondary_modalities: [text], min_independent_evidence: 1, allow_text_only_output: false}
    output_profile: eis_interval_default
  object_instance_search:
    expected_granularity: {primary_levels: [L2, L1], context_levels: [L3], output_level: source_specific_interval}
    evidence_policy: {primary_modalities: [visual], secondary_modalities: [text], min_independent_evidence: 1, allow_text_only_output: false}
    visual_example_paths: []
    visual_example_policy: {allow_visual_examples: true, if_missing: use_text_prompts_only}
    object_state_constraints: {required: [], excluded_contexts: [], state_fit_rules: []}
    output_profile: ois_interval_default
  question_answering:
    expected_granularity: {primary_levels: [L3, L4, L5], context_levels: [L2, L3, L4, L5], output_level: answer_text}
    evidence_policy: {primary_modalities: [text], secondary_modalities: [visual, event_context], min_independent_evidence: 1, allow_text_only_output: true}
    threshold_profile: qa_evidence_required
    output_profile: qa_answer_default
    answer_policy_defaults:
      keyword_frames: {positive: [], negative: [], relation_predicates: []}
      multilingual_aliases: {}
      speaker_attribution: {allow_ego_source_hint: true, fixed_room_is_actor: false, require_relation_direction_for_relation_questions: true}
      answer_template: "<answer>. Evidence: <evidence>."
